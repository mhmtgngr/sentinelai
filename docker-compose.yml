version: "3.9"

services:
  sentinel-ai:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - API_HOST=0.0.0.0
      - API_PORT=8080
    volumes:
      - ./config:/app/config:ro
    depends_on:
      - chromadb
    restart: unless-stopped

  chromadb:
    build:
      context: .
      dockerfile: docker/Dockerfile.chromadb
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - ANONYMIZED_TELEMETRY=false
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - sentinel-ai
    restart: unless-stopped

volumes:
  chroma_data:
