services:
  sentinel-ai:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      postgresql:
        condition: service_healthy
      chromadb:
        condition: service_started
    volumes:
      - ./config:/app/config:ro
    networks:
      - sentinel-internal

  postgresql:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sentinel_ai
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel_ai"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sentinel-internal

  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8100:8000"
    volumes:
      - chromadb_data:/chroma/chroma
    networks:
      - sentinel-internal

volumes:
  postgres_data:
  chromadb_data:

networks:
  sentinel-internal:
    driver: bridge
