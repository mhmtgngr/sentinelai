# Example: Custom STRIDE Template for a new asset type
#
# Add STRIDE threat definitions for asset types not covered by the built-in
# templates (server, workstation, user, network_device).
#
# Copy this file and customize for your environment.

asset_type: database  # Must be unique — this becomes the lookup key

threats: []
