title: SSH Brute Force Login Attempt
id: 5710-ssh-brute-force
status: stable
description: Detects multiple failed SSH login attempts from a single source IP, indicating a brute force attack.
references:
  - https://attack.mitre.org/techniques/T1110/001/
author: Sentinel-AI
date: 2024/01/15
tags:
  - attack.credential_access
  - attack.t1110.001
logsource:
  product: linux
  service: sshd
detection:
  selection:
    event_type: authentication_failure
    service: sshd
  condition: selection | count(source_ip) by destination_host > 10
  timeframe: 5m
falsepositives:
  - Legitimate users with forgotten passwords
  - Automated scripts with expired credentials
  - Vulnerability scanners during authorized testing
level: high
fields:
  - source_ip
  - destination_host
  - username
  - attempt_count
